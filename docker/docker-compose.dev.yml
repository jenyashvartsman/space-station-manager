services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: space_station_dev
      POSTGRES_USER: space_station
      POSTGRES_PASSWORD: space_station_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U space_station"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
